plugins { id 'com.android.application' }
android {
 namespace 'com.xdownload.mobile'
 compileSdk 36
 defaultConfig {
  applicationId 'com.xdownload.pro.next'
  minSdk 29
  if (project.hasProperty('phoneAbi')) { ndk { abiFilters project.property('phoneAbi').toString() } }
  targetSdk 34
  versionCode 18
  versionName '4.0-rc2'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 packaging { jniLibs { useLegacyPackaging = true; pickFirsts += ['**/libc++_shared.so'] }; resources { merges += ['META-INF/LICENSE*','META-INF/NOTICE*']; excludes += ['META-INF/DEPENDENCIES','META-INF/versions/**/module-info.class'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 if (System.getenv('XDOWNLOAD_KEYSTORE')) {
  signingConfigs { persistent { storeFile file(System.getenv('XDOWNLOAD_KEYSTORE')); storePassword System.getenv('XDOWNLOAD_STORE_PASSWORD'); keyAlias System.getenv('XDOWNLOAD_KEY_ALIAS'); keyPassword System.getenv('XDOWNLOAD_KEY_PASSWORD') } }
  buildTypes { release { signingConfig signingConfigs.persistent } }
 }
}
dependencies {
 implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
 implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
 implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.1'
 implementation 'androidx.media3:media3-transformer:1.5.1'
 implementation 'org.apache.commons:commons-compress:1.28.0'
 implementation 'org.tukaani:xz:1.10'
 implementation 'com.github.junrar:junrar:8.1.2'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:core:1.6.1'
}