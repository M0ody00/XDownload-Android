plugins { id 'com.android.application' }
android {
 namespace 'com.xdownload.mobile'
 compileSdk 36
 defaultConfig {
  applicationId 'com.xdownload.pro'
  minSdk 29
  targetSdk 34
  versionCode 2
  versionName '1.0-rc2'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 packaging { jniLibs { pickFirsts += ['**/libc++_shared.so'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 if (System.getenv('XDOWNLOAD_KEYSTORE')) {
  signingConfigs { persistent { storeFile file(System.getenv('XDOWNLOAD_KEYSTORE')); storePassword System.getenv('XDOWNLOAD_STORE_PASSWORD'); keyAlias System.getenv('XDOWNLOAD_KEY_ALIAS'); keyPassword System.getenv('XDOWNLOAD_KEY_PASSWORD') } }
  buildTypes { release { signingConfig signingConfigs.persistent } }
 }
}
dependencies {
 implementation 'androidx.media3:media3-transformer:1.5.1'
 implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.7'
 implementation 'com.arthenica:smart-exception-java:0.2.1'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:core:1.6.1'
}