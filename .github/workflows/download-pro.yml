name: X Download Pro verification
on:
  push:
    branches: [x-download-pro]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - run: |
          mkdir -p candidate
          cp app/build/outputs/apk/debug/app-debug.apk candidate/XDownload-Pro.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk candidate/test.apk
          unzip -tq candidate/XDownload-Pro.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs candidate/XDownload-Pro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: candidate/
  emulator:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: candidate
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -g candidate/XDownload-Pro.apk
            adb install -g candidate/test.apk
            adb shell am instrument -w com.xdownload.pro.test/androidx.test.runner.AndroidJUnitRunner | tee result.txt
            grep -F 'OK (1 test)' result.txt
  verified:
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: candidate
      - uses: actions/upload-artifact@v4
        with:
          name: XDownload-Pro-RC1-TESTED
          path: candidate/XDownload-Pro.apk
