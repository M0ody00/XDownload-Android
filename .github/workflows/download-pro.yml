name: X Download Pro verification
on:
  push:
    branches: [x-download-pro]
  workflow_dispatch:
concurrency:
  group: xdownload-verification-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Generate synthetic audio fixture
        run: |
          mkdir -p app/src/androidTest/assets
          python3 - <<'PY'
          import wave, math, struct
          with wave.open('app/src/androidTest/assets/sample.wav', 'wb') as f:
              f.setparams((1, 2, 44100, 0, 'NONE', 'not compressed'))
              f.writeframes(b''.join(struct.pack('<h', int(12000*math.sin(2*math.pi*440*i/44100))) for i in range(88200)))
          PY
      - name: Build and test with bounded repository rate-limit retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eiq 'status code 429|Too Many Requests' "$RUNNER_TEMP/gradle-build.log"; then
              exit 1
            fi
            sleep "$((attempt * 30))"
          done
      - run: |
          mkdir -p candidate
          cp app/build/outputs/apk/debug/app-debug.apk candidate/XDownload-Pro.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk candidate/test.apk
          unzip -tq candidate/XDownload-Pro.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs candidate/XDownload-Pro.apk
      - name: Build ARM64 phone candidate
        run: |
          gradle --no-daemon --offline :app:assembleDebug -PphoneAbi=arm64-v8a
          mkdir -p phone
          cp app/build/outputs/apk/debug/app-debug.apk phone/XDownload-Pro-ARM64.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs phone/XDownload-Pro-ARM64.apk
          "$BT/aapt" dump badging phone/XDownload-Pro-ARM64.apk | grep "native-code: 'arm64-v8a'"
          unzip -tq phone/XDownload-Pro-ARM64.apk
          unzip -Z1 phone/XDownload-Pro-ARM64.apk | grep -Fx lib/arm64-v8a/libpython.so
          unzip -Z1 phone/XDownload-Pro-ARM64.apk | grep -Fx lib/arm64-v8a/libffmpeg.so
          unzip -Z1 phone/XDownload-Pro-ARM64.apk | grep -Fx lib/arm64-v8a/libaria2c.so
      - name: Measure ARM64 APK and enforce native deduplication
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          p = pathlib.Path('phone/XDownload-Pro-ARM64.apk')
          with zipfile.ZipFile(p) as z:
              entries = z.infolist()
              assert not any('libffmpegkit' in x.filename for x in entries), 'duplicate FFmpegKit remains'
              lines = ['ARM64 APK bytes: '+str(p.stat().st_size), 'Baseline bytes: 84147551', 'Savings bytes: '+str(84147551-p.stat().st_size)]
              lines += [str(x.compress_size)+' '+x.filename for x in sorted(entries,key=lambda x:x.compress_size,reverse=True)[:30]]
              report = '\n'.join(lines)
              print(report)
              pathlib.Path('phone/SIZE-REPORT.txt').write_text(report+'\n')
              assert p.stat().st_size < 84147551, 'APK size regression'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phone-candidate
          path: phone/
      - uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: candidate/
  emulator:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 35]
    steps:
      - name: Fetch tested build candidate
        id: fetch_candidate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: candidate
          path: candidate
      - if: steps.fetch_candidate.outcome == 'failure'
        run: sleep 15
      - if: steps.fetch_candidate.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: candidate
          path: candidate
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -g candidate/XDownload-Pro.apk
            adb install -g candidate/test.apk
            adb shell am instrument -w com.xdownload.pro.next.test/androidx.test.runner.AndroidJUnitRunner | tee result.txt
            grep -F 'OK (23 tests)' result.txt
  verified:
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch tested build candidate
        id: fetch_candidate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: candidate
          path: candidate
      - if: steps.fetch_candidate.outcome == 'failure'
        run: sleep 15
      - if: steps.fetch_candidate.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: candidate
          path: candidate
      - uses: actions/upload-artifact@v4
        with:
          name: XDownload-Pro-4.0-RC4-X8-TESTED
          path: candidate/XDownload-Pro.apk
      - name: Fetch ARM64 candidate
        id: fetch_phone
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phone-candidate
          path: phone
      - if: steps.fetch_phone.outcome == 'failure'
        run: sleep 15
      - if: steps.fetch_phone.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: phone-candidate
          path: phone
      - uses: actions/upload-artifact@v4
        with:
          name: XDownload-Pro-4.0-RC4-X8-ARM64-DEVICE-TEST-REQUIRED
          path: phone/
