name: Build and test X Player Pro RC 1
on:
  push:
    branches: [x-player-pro]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Create synthetic media test files
        run: |
          set -e
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          D=app/src/androidTest/assets
          mkdir -p "$D"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x180:rate=24 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 8 -c:v libx264 -pix_fmt yuv420p -profile:v baseline -c:a aac "$D/sample.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$D/sample.mp4" -c copy "$D/sample.mkv"
          ffmpeg -hide_banner -loglevel error -y -i "$D/sample.mp4" -c:v libvpx -b:v 300k -c:a libopus "$D/sample.webm"
          ffmpeg -hide_banner -loglevel error -y -i "$D/sample.mp4" -vn -c:a libmp3lame "$D/sample.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "$D/sample.mp4" -vn -c:a flac "$D/sample.flac"
          ffmpeg -hide_banner -loglevel error -y -i "$D/sample.mp4" -vn -c:a pcm_s16le "$D/sample.wav"
      - run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify APK
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          unzip -tq "$APK"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | tee apk-info.txt
          grep -F "package: name='com.xplayer.pro'" apk-info.txt
          grep -F "sdkVersion:'24'" apk-info.txt
          mkdir -p candidate
          cp "$APK" candidate/XPlayer-Pro.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk candidate/test.apk
          sha256sum candidate/*.apk
          ls -lh candidate/*.apk
          "$BT/apkanalyzer" --help >/dev/null 2>&1 || true
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > candidate/dependencies.txt
      - name: Build OPPO ARM64 package with same signing key
        run: |
          set -e
          gradle --no-daemon :app:assembleDebug -PphoneAbi=arm64-v8a
          mkdir -p phone
          cp app/build/outputs/apk/debug/app-debug.apk phone/XPlayer-Pro-ARM64.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose phone/XPlayer-Pro-ARM64.apk
          "$BT/aapt" dump badging phone/XPlayer-Pro-ARM64.apk | tee phone/badging.txt
          grep -F "native-code: 'arm64-v8a'" phone/badging.txt
          unzip -Z1 phone/XPlayer-Pro-ARM64.apk | grep -F "lib/arm64-v8a/libvlc.so"
          unzip -Z1 phone/XPlayer-Pro-ARM64.apk | grep -F "lib/arm64-v8a/libffmpegkit.so"
          sha256sum phone/*.apk
          ls -lh phone/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-build-candidate
          path: phone/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: player-test-candidate
          path: candidate/
          if-no-files-found: error
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: player-test-candidate
          path: candidate
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare playback test
        run: |
          cat > /tmp/player-test.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          mkdir -p evidence
          adb install -g candidate/XPlayer-Pro.apk
          adb install -t candidate/test.apk
          adb shell am instrument -w -r com.xplayer.pro.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/instrumentation.txt
          adb logcat -d -s XPlayerTest:I AndroidRuntime:E > evidence/playback-log.txt
          cat evidence/playback-log.txt
          grep -E 'OK \(14 tests\)' evidence/instrumentation.txt
          if grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' evidence/instrumentation.txt; then exit 1; fi
          EOF
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash /tmp/player-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-playback-api-${{ matrix.api }}
          path: evidence/
          if-no-files-found: warn
  publish-tested:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: player-test-candidate
          path: candidate
      - uses: actions/upload-artifact@v4
        with:
          name: XPlayer-Pro-RC1-EMULATOR-TESTED
          path: candidate/XPlayer-Pro.apk
          if-no-files-found: error

      - uses: actions/download-artifact@v4
        with:
          name: arm64-build-candidate
          path: phone
      - uses: actions/upload-artifact@v4
        with:
          name: XPlayer-Pro-RC1-ARM64-DEVICE-TEST-REQUIRED
          path: phone/XPlayer-Pro-ARM64.apk
          if-no-files-found: error
