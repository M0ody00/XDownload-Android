name: Test original APKs on Android
on: [push, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  test-original-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XDownload-APK
          run-id: 45386987082
          github-token: ${{ github.token }}
          path: original/full
      - uses: actions/download-artifact@v4
        with:
          name: XDownload-Lite-ARM64
          run-id: 45388854528
          github-token: ${{ github.token }}
          path: original/lite
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare exact-APK smoke test
        shell: bash
        run: |
          cat > /tmp/test-original.sh <<'EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          mkdir -p test-results
          echo "Android API: $(adb shell getprop ro.build.version.sdk)" | tee test-results/device.txt
          echo "Supported ABIs: $(adb shell getprop ro.product.cpu.abilist)" | tee -a test-results/device.txt
          echo "Native bridge: $(adb shell getprop ro.dalvik.vm.native.bridge)" | tee -a test-results/device.txt
          sha256sum original/full/*.apk original/lite/*.apk | tee test-results/apk-sha256.txt
          failed=0
          test_apk() {
            local label="$1" apk="$2" pkg="$3"
            echo "=== $label ==="
            adb logcat -c
            if ! adb install "$apk" 2>&1 | tee "test-results/$label-install.txt"; then
              echo "$label: INSTALL FAILED" | tee -a test-results/result.txt
              adb logcat -d -t 1000 > "test-results/$label-logcat.txt"
              failed=1
              return
            fi
            if ! adb shell am start -W -n "$pkg/com.xdownload.mobile.MainActivity" 2>&1 | tee "test-results/$label-launch.txt"; then
              echo "$label: LAUNCH FAILED" | tee -a test-results/result.txt
              failed=1
            fi
            sleep 10
            adb shell dumpsys activity activities > "test-results/$label-activities.txt"
            adb logcat -d -v threadtime > "test-results/$label-logcat.txt"
            adb exec-out screencap -p > "test-results/$label-screen.png"
            if adb shell pidof "$pkg" >/dev/null && grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' "test-results/$label-activities.txt" | grep -F "$pkg" >/dev/null; then
              echo "$label: INSTALLED AND OPENED (foreground after 10 seconds)" | tee -a test-results/result.txt
            else
              echo "$label: NOT OPEN / PROCESS NOT IN FOREGROUND" | tee -a test-results/result.txt
              grep -A 18 -E 'FATAL EXCEPTION|Fatal signal|Unable to start activity' "test-results/$label-logcat.txt" | tail -n 120 || true
              failed=1
            fi
            adb shell am force-stop "$pkg" || true
          }
          test_apk full original/full/XDownload.apk com.xdownload.mobile
          test_apk lite original/lite/XDownload-Lite-ARM64.apk com.xdownload.mobile.lite
          cat test-results/result.txt
          exit "$failed"
          EOF
      - name: Install and open the two original APKs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash /tmp/test-original.sh
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-apk-test-api-${{ matrix.api }}
          path: test-results/
          if-no-files-found: warn
